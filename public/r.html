<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rapport de maintenance — FroidPass</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
<script src="config.js?v=4"></script>
</head>
<body>
<div class="wrap" style="padding:20px 18px 60px">
  <div class="noprint" style="display:flex;gap:8px;justify-content:center;margin-bottom:14px"><button class="btn btn-hot btn-sm" onclick="print()">Imprimer / Enregistrer en PDF</button></div>
  <div class="cert" id="c"><p class="empty">Chargement du rapport…</p></div>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { periode } from "./periodes.js?v=1";
const CFG = window.FROIDPASS_CONFIG;
const TYPES = { split:["Split mural / console",60,90], cassette:["Cassette / gainable",60,90], groupe:["Groupe extérieur",60,90], chambre:["Chambre froide",30,30], vitrine:["Armoire / vitrine réfrigérée",60,90], vrv:["VRV / DRV",60,90], cta:["Centrale de traitement d'air",30,30], eau_glacee:["Groupe d'eau glacée",30,30], clim_precision:["Climatisation de précision",30,30], frigo_medical:["Réfrigérateur médical / labo",30,30], chambre_mortuaire:["Chambre mortuaire",30,30], ventilation:["Ventilation / extraction",90,90] };
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const PHOTO_CAT = { defectueuse: ["Pièce défectueuse", "p-bad"], remplacee: ["Pièce remplacée (neuve)", "p-ok"], avant: ["Avant intervention", "p-warn"], apres: ["Après intervention", "p-ok"], autre: ["Autre", ""] };
const photoUrl = p => CFG.SUPABASE_URL + "/storage/v1/object/public/photos/" + String(p).split("/").map(encodeURIComponent).join("/");
const photosHTML = l => `<div class="ph-grid">${l.map(ph => { const c = PHOTO_CAT[ph.categorie] || PHOTO_CAT.autre; return `<figure><a href="${photoUrl(ph.path)}" target="_blank" rel="noopener"><img loading="lazy" src="${photoUrl(ph.path)}" alt="${c[0]}"></a><figcaption><span class="pill ${c[1]}">${c[0]}</span>${ph.legende ? " " + esc(ph.legende) : ""}</figcaption></figure>`; }).join("")}</div>`
  + l.map((ph, k) => ph.analyse && ph.analyse.valide ? `<div class="ia-box ok"><div class="ia-h"><b>Diagnostic de la pièce — photo ${k + 1}${ph.legende ? " (" + esc(ph.legende) + ")" : ""}</b><span class="m">validé par le responsable maintenance</span></div><div class="ia-t">${esc(ph.analyse.texte)}</div></div>` : "").join("");
const fr = s => s ? String(s).slice(0,10).split("-").reverse().join("/") : "—";
const el = document.getElementById("c");
try {
  const q = new URLSearchParams(location.search), code = q.get("c"), mois = q.get("m");
  const P = periode(mois || "");
  if (!code || !P) throw new Error("Lien de rapport invalide");
  const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const { data, error } = await sb.rpc("get_rapport", { p_code: code, p_mois: mois });
  if (error) throw error; if (!data) throw new Error("Rapport introuvable");
  const finMois = P.fin - 864e5, _n = new Date(), today = Date.UTC(_n.getFullYear(), _n.getMonth(), _n.getDate());
  const ref = Math.min(finMois, today), libelle = P.lib;
  const eqs = data.equipements.map(e => { const t = TYPES[e.type] || ["Équipement",90,90], f = e.frequence_jours || (e.environnement === "cotier" ? t[1] : e.environnement === "exterieur" ? Math.round((t[1] + t[2]) / 30) * 15 : t[2]); const next = Date.parse(e.dernier_preventif || e.date_pose) + f * 864e5; return { ...e, label: t[0], next, d: Math.round((next - ref) / 864e5) }; });
  const late = eqs.filter(e => e.d < 0).length, pct = eqs.length ? Math.round(100 * (eqs.length - late) / eqs.length) : 0;
  const ints = data.interventions, prev = ints.filter(i => i.type === "preventif").length;
  const pr = data.prestataire || {}, zones = [...new Set(eqs.map(e => e.zone || ""))];
  document.title = `${P.titre} — ${libelle} — ${data.client.nom}`;
  const ligneMois = P.nbMois > 1 ? `<h3 style="font-size:17px;margin-top:20px">Évolution sur la période</h3>
    <table><tr><th>Mois</th><th>Préventives</th><th>Curatives</th><th>Total</th></tr>${P.mois.map(x => { const l = ints.filter(i => String(i.date).slice(0, 7) === x.code), pv = l.filter(i => i.type === "preventif").length; return `<tr><td>${x.lib}</td><td>${pv}</td><td>${l.length - pv}</td><td><b>${l.length}</b></td></tr>`; }).join("")}
    <tr><td><b>Total</b></td><td><b>${prev}</b></td><td><b>${ints.length - prev}</b></td><td><b>${ints.length}</b></td></tr></table>` : "";
  el.innerHTML = `<div class="ch"><div><div class="disp" style="font-size:26px;font-weight:800">${P.titre}</div>
      <div style="font-size:18px;font-weight:600;margin-top:4px">${esc(data.client.nom)}</div><div class="m">Période : ${libelle}${P.nbMois > 1 ? ` (du ${fr(new Date(P.debut).toISOString())} au ${fr(new Date(finMois).toISOString())})` : ""}</div></div>
      <div style="text-align:right;font-size:14px"><b>${esc(pr.entreprise || pr.nom)}</b><br>${esc(pr.nom)}<br><span class="mono">${esc(pr.whatsapp)}</span></div></div>
    <h3 style="font-size:17px">1. Synthèse ${P.nbMois > 1 ? "de la période" : "du mois"}</h3>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0">
      ${[[eqs.length,"équipements suivis"],[pct + " %","du parc à jour"],[ints.length,"interventions"],[data.signalements,"pannes signalées"]].map(([v,l]) => `<div style="border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center"><div class="disp" style="font-size:24px;font-weight:800">${v}</div><div class="m" style="font-size:12.5px">${l}</div></div>`).join("")}
    </div>
    <p style="font-size:14px">${prev} entretien(s) préventif(s) et ${ints.length - prev} intervention(s) curative(s) réalisés sur la période (${libelle}).${late ? ` <b style="color:var(--bad)">${late} équipement(s) à rattraper.</b>` : " Aucun équipement en retard."}</p>
    ${ligneMois}
    <h3 style="font-size:17px;margin-top:20px">2. Interventions réalisées</h3>
    <table><tr><th>Date</th><th>Équipement</th><th>Type</th><th>Mesures</th><th>Observations</th></tr>
    ${ints.map(i => `<tr><td class="mono">${fr(i.date)}</td><td>${esc(i.equipement)}</td><td>${i.type === "preventif" ? "Préventif" : "Curatif"}</td><td class="mono" style="font-size:12px">${[i.hp != null && "HP " + i.hp, i.bp != null && "BP " + i.bp, i.intensite != null && "I " + i.intensite + " A", i.t_soufflage != null && "Ts " + i.t_soufflage + " °C", i.t_reprise != null && "Tr " + i.t_reprise + " °C"].filter(Boolean).join(" · ") || "—"}</td><td>${esc(i.observations)}</td></tr>`).join("") || `<tr><td colspan="5">Aucune intervention sur la période</td></tr>`}</table>
    ${(() => { const l = ints.filter(i => Array.isArray(i.photos) && i.photos.length); const nb = l.reduce((n, i) => n + i.photos.length, 0); return l.length ? `<h3 style="font-size:17px;margin-top:20px">Photos des pièces défectueuses et remplacées <span class="m" style="font-weight:400">(${nb})</span></h3>${l.map(i => `<div class="ph-bloc"><div style="font-size:13.5px;font-weight:600;margin-top:8px">${fr(i.date)} · ${esc(i.equipement)} · ${i.type === "preventif" ? "Préventif" : "Curatif"}${i.observations ? ` — <span style="font-weight:400">${esc(i.observations)}</span>` : ""}</div>${photosHTML(i.photos)}</div>`).join("")}` : ""; })()}
    <h3 style="font-size:17px;margin-top:20px">3. État du parc au ${fr(new Date(ref).toISOString())}</h3>
    ${zones.map(z => `${zones.length > 1 || z ? `<div style="font-weight:600;margin-top:10px">${esc(z || "Autres")}</div>` : ""}<table><tr><th>Équipement</th><th>Type</th><th>Dernier entretien</th><th>Prochain</th><th>Statut</th></tr>
      ${eqs.filter(e => (e.zone || "") === z).map(e => `<tr><td>${esc(e.emplacement)}${e.criticite === "critique" ? ' <span class="pill p-bad">Critique</span>' : ""}</td><td>${e.label}</td><td class="mono">${fr(e.dernier_preventif)}</td><td class="mono">${fr(new Date(e.next).toISOString())}</td><td><span class="pill ${e.d < 0 ? "p-bad" : e.d <= 14 ? "p-warn" : "p-ok"}">${e.d < 0 ? "En retard" : e.d <= 14 ? "Bientôt" : "À jour"}</span></td></tr>`).join("")}</table>`).join("") || '<p class="empty">Aucun équipement.</p>'}
    <h3 style="font-size:17px;margin-top:20px">4. Prochains entretiens (30 jours)</h3>
    ${(() => { const l = eqs.filter(e => e.next <= ref + 30 * 864e5).sort((a, b) => a.next - b.next); return l.length ? `<table><tr><th>Date prévue</th><th>Équipement</th><th>Type</th></tr>${l.map(e => `<tr><td class="mono" style="color:${e.d < 0 ? "var(--bad)" : "inherit"}">${e.d < 0 ? "À rattraper" : fr(new Date(e.next).toISOString())}</td><td>${esc(e.emplacement)}</td><td>${e.label}</td></tr>`).join("")}</table>` : '<p style="font-size:14px">Aucun entretien prévu dans les 30 jours.</p>'; })()}
    <p class="m" style="margin-top:22px">Rapport généré par FroidPass. Pour toute question : ${esc(pr.entreprise || pr.nom)} ${esc(pr.whatsapp)}.</p>`;
} catch (err) { el.innerHTML = `<h3>Rapport indisponible</h3><p class="m">${esc(err.message)}</p>`; }
</script>
</body>
</html>
